<title>LOOP</title>
<desc>LOOP brand mark. Canonical master: every icon, favicon and the launch mark
are derived from this file by build-brand.js. Do not edit the derived files.

Construction on a 1024 grid centred on (512,512): a rounded-square loop whose
stroke centreline is a 448px square with 120px corners, drawn 128px wide
(outer extent 576px, square counter 320px). The L is exactly
the loop's lower-left quarter: the left side, the bottom-left corner and the
bottom side, ending on the tangent points of the two neighbouring corners. The
rest of the loop passes beneath the L's two ends: each is cut square 12px
beyond the L, and a short shadow falls on it there. Every edge is a straight
line or a circular arc; the drawing is mirror-symmetric about the diagonal from
the bottom-left corner to the top-right corner.</desc>
